<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f6e56">
  <link rel="manifest" href="/manifest.json">
  <title>Mi Contador</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>Mi Contador</h1>
  </header>

  <main>
    <section id="resumen" class="card">
      <h2>Este mes</h2>
      <div id="resumen-cifras">Cargando…</div>
    </section>

    <section class="card">
      <h2>Preguntar al asistente</h2>
      <div class="fila">
        <input id="pregunta" type="text" placeholder="¿Cuánto gasté en comida este mes?">
        <button id="btn-preguntar">Preguntar</button>
      </div>
      <p id="respuesta-ia" class="respuesta"></p>
    </section>

    <section class="card">
      <h2>Nuevo movimiento</h2>
      <div class="fila">
        <select id="mov-tipo">
          <option value="gasto">Gasto</option>
          <option value="ingreso">Ingreso</option>
        </select>
        <input id="mov-monto" type="number" step="0.01" min="0" placeholder="Monto">
      </div>
      <div class="fila">
        <select id="mov-cuenta"></select>
        <select id="mov-categoria"><option value="">Sin categoría</option></select>
      </div>
      <input id="mov-desc" type="text" placeholder="Descripción">
      <button id="btn-guardar">Guardar</button>
    </section>

    <section class="card">
      <h2>Movimientos recientes</h2>
      <ul id="lista-mov"></ul>
    </section>

    <section class="card">
      <h2>Reportes</h2>
      <div class="fila">
        <button id="btn-mes-anterior" class="secundario" type="button">&larr; Mes anterior</button>
        <span id="reportes-mes-actual" class="mes-actual"></span>
        <button id="btn-mes-siguiente" class="secundario" type="button">Mes siguiente &rarr;</button>
      </div>
      <h3>Comparativa vs. mes anterior</h3>
      <div id="comparativa">Cargando…</div>
      <h3>Balance por cuenta</h3>
      <div id="balance-cuentas">Cargando…</div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
